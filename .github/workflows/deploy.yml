name: Deploy to Vercel

on:
  push:
    branches:
      - claude/add-french-support-dUuix

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher déploiement Vercel
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Déclenchement Vercel deploy hook..."
          curl -sf -X POST "$VERCEL_DEPLOY_HOOK"
          echo "Déploiement déclenché ✅"
