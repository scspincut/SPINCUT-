name: Deploy to Vercel

on:
  push:
    branches:
      - claude/add-french-support-dUuix
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "=== Token check ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects?limit=1")
          echo "API status: $STATUS"

          echo "=== Project list ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects?limit=10" | python3 -c "import sys,json; data=json.load(sys.stdin); [print(p['id'], p['name']) for p in data.get('projects',[])]" || echo "API error"

          echo "=== Deploy ==="
          npx vercel --prod --token "$VERCEL_TOKEN" --yes
