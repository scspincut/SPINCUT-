name: Deploy to Vercel

on:
  push:
    branches:
      - claude/add-french-support-dUuix
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          RESPONSE=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects?limit=100")
          PROJECT_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; ps=json.load(sys.stdin).get('projects',[]); p=next((x for x in ps if 'spincut' in x['name'].lower()),None); print(p['id'] if p else '')")
          ORG_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; ps=json.load(sys.stdin).get('projects',[]); p=next((x for x in ps if 'spincut' in x['name'].lower()),None); print(p.get('accountId','') if p else '')")
          echo "Project: $PROJECT_ID  Org: $ORG_ID"
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$PROJECT_ID" "$ORG_ID" > .vercel/project.json
          npx vercel --prod --token "$VERCEL_TOKEN" --yes
