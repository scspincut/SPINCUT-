name: Deploy to Vercel

on:
  push:
    branches:
      - claude/add-french-support-dUuix
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deployment
        run: |
          echo "Déclenchement du déploiement..."
          RESPONSE=$(curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          echo "Réponse Vercel: $RESPONSE"
