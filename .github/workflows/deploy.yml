name: Deploy to Vercel

on:
  push:
    branches:
      - claude/add-french-support-dUuix

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          ORG_ID=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v2/user | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['user']['id'])")

          mkdir -p .vercel
          printf '{"projectId":"prj_dJ8TDPGexRLRogCvc7vJq0plMplp","orgId":"%s"}' "$ORG_ID" > .vercel/project.json

          VERCEL_ORG_ID="$ORG_ID" \
          VERCEL_PROJECT_ID="prj_dJ8TDPGexRLRogCvc7vJq0plMplp" \
          npx vercel@latest --prod --yes --token "$VERCEL_TOKEN"
