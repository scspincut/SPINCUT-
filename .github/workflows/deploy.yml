name: Deploy to Vercel

on:
  push:
    branches:
      - claude/add-french-support-dUuix

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Récupère l'orgId depuis l'API Vercel (= userId pour compte Hobby)
          ORG_ID=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v2/user | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['user']['id'])")

          echo "OrgId: $ORG_ID"

          # Crée la config projet Vercel directement
          mkdir -p .vercel
          printf '{"projectId":"prj_dJ8TDPGexRLRogCvc7vJq0plMplp","orgId":"%s"}' "$ORG_ID" > .vercel/project.json

          # Déploiement production
          npx vercel@latest --prod --yes --token "$VERCEL_TOKEN"
