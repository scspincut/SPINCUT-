name: Deploy to Vercel

on:
  push:
    branches:
      - claude/add-french-support-dUuix
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "URL length: ${#HOOK_URL}"
          curl -s -X POST "${HOOK_URL}" && echo "OK" || echo "curl exit: $?"
